<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<!-- GitHub Pages 가 없는 주소마다 이 파일을 404 상태로 내준다. 어느 깊이에서든 뜨므로 링크는 절대경로(/)로 쓴다 -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>페이지를 찾을 수 없습니다 · 김정은</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#000000">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23000'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%23e8e8e8'/%3E%3C/svg%3E">
<style>
  /* index.html 과 같은 스타일 — 빌드 단계가 없어 공유 CSS 대신 복사해 둔다. 한쪽을 바꾸면 같이 바꿀 것 */
  :root { color-scheme: dark; }
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #000;
    color: #ededed;
    font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', Pretendard,
                 'Noto Sans KR', 'Malgun Gothic', '맑은 고딕', sans-serif;
    min-height: 100vh;
    min-height: 100dvh;
    display: grid;
    place-items: center;
    padding: 24px;
    padding-top: max(24px, env(safe-area-inset-top, 24px));
    padding-bottom: max(24px, env(safe-area-inset-bottom, 24px));
    text-align: center;
    -webkit-text-size-adjust: 100%;
    -webkit-font-smoothing: antialiased;
  }

  main { max-width: min(30rem, 100%); }

  h1 {
    font-size: clamp(1.0625rem, 4.6vw, 1.75rem);
    font-weight: 600;
    line-height: 1.65;
    letter-spacing: -0.015em;
    word-break: keep-all;
  }

  p {
    margin-top: 1.9rem;
    font-size: clamp(0.875rem, 3.4vw, 1rem);
    line-height: 1.6;
    color: #8b8b8b;
    word-break: keep-all;
  }

  a {
    color: #ededed;
    text-decoration: none;
    border-bottom: 1px solid #3a3a3a;
    padding-bottom: 2px;
    display: inline-block;
    transition: border-color 0.2s;
  }
  a:hover, a:focus-visible { border-bottom-color: #ededed; }
</style>
</head>
<body>
  <main>
    <h1>찾으시는 페이지가 없습니다.<br>김정은 홈페이지 준비 중입니다.</h1>
    <p><a href="/">처음으로</a> · 이메일 <a href="mailto:hi@kimjungeun.com">hi@kimjungeun.com</a></p>
  </main>
</body>
</html>
