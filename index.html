<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<!-- viewport-fit=cover: 아이폰 노치 영역까지 배경(검정)이 채워지게 -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>김정은</title>
<meta name="description" content="김정은 홈페이지 준비 중입니다. 이메일 hi@kimjungeun.com">
<meta name="theme-color" content="#000000">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23000'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%23e8e8e8'/%3E%3C/svg%3E">
<style>
  /* 브라우저·OS가 밝은 테마여도 폼 요소·스크롤바까지 어둡게 맞춘다 */
  :root { color-scheme: dark; }
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #000;
    color: #ededed;
    font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', Pretendard,
                 'Noto Sans KR', 'Malgun Gothic', '맑은 고딕', sans-serif;
    /* dvh: 모바일 브라우저 주소창이 접혔다 펴져도 가운데가 흔들리지 않는다 */
    min-height: 100vh;
    min-height: 100dvh;
    /* flex 대신 grid — 내용이 화면보다 넓어져도 가운데가 어긋나지 않는다 */
    display: grid;
    place-items: center;
    padding: 24px;
    /* env() 는 **대체값을 반드시 준다** — 없으면 미지원 환경에서 선언 전체가 무효가 되어
       패딩이 통째로 사라진다(실측: 헤드리스 렌더에서 정렬이 어긋났다) */
    padding-top: max(24px, env(safe-area-inset-top, 24px));
    padding-bottom: max(24px, env(safe-area-inset-bottom, 24px));
    text-align: center;
    -webkit-text-size-adjust: 100%;
    -webkit-font-smoothing: antialiased;
  }

  /* min(): 좁은 화면에서 30rem 을 넘겨 넘치지 않게 */
  main { max-width: min(30rem, 100%); }

  /* clamp: 작은 화면에서 줄바꿈이 지저분해지지 않게 글자 크기를 화면에 맞춰 줄인다 */
  h1 {
    font-size: clamp(1.0625rem, 4.6vw, 1.75rem);
    font-weight: 600;
    line-height: 1.65;
    letter-spacing: -0.015em;
    /* 한글은 어절 단위로 끊어야 읽기 좋다 */
    word-break: keep-all;
  }

  p {
    margin-top: 1.9rem;
    font-size: clamp(0.875rem, 3.4vw, 1rem);
    line-height: 1.6;
    color: #8b8b8b;
    word-break: keep-all;
  }

  a {
    color: #ededed;
    text-decoration: none;
    border-bottom: 1px solid #3a3a3a;
    padding-bottom: 2px;
    /* 모바일에서 누르기 좋게 */
    display: inline-block;
    transition: border-color 0.2s;
  }
  a:hover, a:focus-visible { border-bottom-color: #ededed; }
</style>
</head>
<body>
  <main>
    <h1>안녕하세요.<br>김정은 홈페이지 준비 중입니다.</h1>
    <p>이메일 <a href="mailto:hi@kimjungeun.com">hi@kimjungeun.com</a></p>
  </main>
</body>
</html>
